# ai-rss — personal AI newspaper (qwen-on-tower scrapes + curates the web)
# Edit columns/queries freely; this is the editorial brief.

# This is an overnight batch job (systemd ai-rss.timer, Mondays 00:00) — nobody is
# waiting on it, so it is tuned for QUALITY, not speed. Reasoning time is free here.
model: qwen3.8-112k                 # tower 3090; long context for multi-article reads
                                   #
                                   # MOVED to 3.8 on 2026-08-26, as the note below planned.
                                   # It is now the one resident model for the whole box —
                                   # cl ai, opencode and this job all name it, so nothing
                                   # evicts anything. `think` below carried over untouched. 3.8's card
                                   # defaults to xhigh reasoning, but llm() always sends
                                   # the field explicitly, so the default never applies —
                                   # measured 2026-08-25: think:false on 3.8 spends 4
                                   # output tokens on a sum where "low" spends 61. Note
                                   # ollama takes high|medium|low|max|true|false; "xhigh"
                                   # is rejected outright. The real cost of 3.8 is
                                   # context, not thinking: it loads a CLIP projector and
                                   # an MTP draft head alongside the weights, so 64k is
                                   # the 100%-GPU ceiling on a 24GB card where 3.6 reaches
                                   # 96k. num_ctx below is 32768, so that is headroom
                                   # spare either way.
ollama_host: http://127.0.0.1:11434
think: false                       # MEASURED off twice. 2026-07-15: think:on and think:off
                                   # scored 15/15 = 15/15, and the prose comparison showed
                                   # thinking writes *more*, not better — padded on thin
                                   # sources, only marginally richer on deep ones — for ~5x
                                   # runtime. That verdict said to revisit if a harder case
                                   # ever separated the two.
                                   #
                                   # 2026-08-25 re-ran it on the condition it named. The
                                   # suite now carries recommend-acts-on-drop-in-upgrade, a
                                   # frozen replay of the week the column called Qwen3.8
                                   # "effectively a rebrand" — the hardest judgment ai-rss
                                   # makes, and the one it had actually got wrong. Result:
                                   # 18/18 = 18/18. Thinking did not rescue the stage that
                                   # failed; better evidence in the prompt did (see
                                   # evidence_lines). Still off.
                                   #
                                   # Read that as "no evidence of a difference", not proof
                                   # of equivalence: both arms are at ceiling, so the suite
                                   # cannot resolve a gap in either direction. Two caveats
                                   # on the 2026-07-15 number specifically — exclude-drops-fp4
                                   # runs through drop_excluded(), which is pure code and
                                   # calls no model, so it scored a free 3/3 on both sides;
                                   # and write_story, the stage thinking was judged to HURT,
                                   # has no case at all. Sharpen those before trusting a
                                   # future tie. (ollama returns thinking in a separate
                                   # field, so JSON mode is unaffected either way.)
num_ctx: 114688                     # must hold the whole candidate menu + a full article;
                                   # 32768 was ample for that and still is. Raised to 65536
                                   # to MATCH the pinned qwen3.8-112k instance: ollama keys a
                                   # loaded model by its context too, so asking for the same
                                   # model at a different num_ctx forces a full unload and
                                   # ~25s reload — and leaves the assistant cold afterwards.
                                   # Verified 2026-08-26: 64k is 100% GPU (1113 tok/s prefill,
                                   # 54 tok/s gen). Any CPU spill is a cliff, not a slowdown,
                                   # so re-check `ollama ps` before raising further.

search:
  results_per_query: 8
  region: wt-wt                    # no region bias
  timelimit: w                     # past week (d/w/m/y or null)
  sleep_between: 1.5               # politeness / rate-limit cushion (seconds)

select:
  per_column: 6                    # final stories that make the issue, per column

write:
  max_article_chars: 18000         # feed the writer the WHOLE model card / release note.
                                   # At 6000 it was summarising a truncated preamble — the
                                   # numbers that matter (size, VRAM, requirements) live
                                   # further down the page.
  fetch_timeout: 20

# Fact-check pass: re-read each written story against its source and catch invented
# claims. The writer is the only stage that can hallucinate, and nothing downstream
# would notice — the recommender trusts the column. Adversarial on purpose: a fresh
# critic told to assume the writer lied, not the writer asked "are you sure?".
verify:
  enabled: true

# The second pass: the paper reads its own column back and says whether to act.
# This is the point of the whole thing — news is the input, the verdict is the output.
recommend:
  enabled: true
  # Verbatim source lines (digits + a benchmark/spec keyword) attached per story, so
  # the verdict can cite numbers the calm summaries flatten out. 6 stories x 1800
  # chars is ~2.7k tokens — comfortable inside num_ctx alongside the menu.
  evidence_chars: 1800

# Where the finished issue lands. Dry runs ignore this and write to ./out/.
deliver:
  outbox: ~/kb/outbox

# Single column for now: "is it time to download a new model?" is the question this
# issue exists to answer. Other columns (AI & the World, World & Politics, Dharma,
# Contemplative-Literary) are in git history at d45bc74 if we want them back.
columns:
  - name: Local AI & Open Models
    brief: |
      This section answers ONE question: "is it time for me to download a new model?"

      THE READER'S RIG — judge every item against this, not against general interest:
        - ONE RTX 3090: 24GB VRAM, Ampere, compute capability 8.6.
        - Runs GGUF through ollama (+ OpenWebUI). Not vLLM, not SGLang, not TensorRT.
        - Today runs qwen3.8:27b at Q4_K_M (~17GB), pinned resident at 112k ctx.
          He is not a cloud-API customer.

      An upgrade is not only a BIGGER model. The most actionable thing this column can
      ever carry is a drop-in successor: same parameter count, same quant, same VRAM,
      same ollama — that simply scores better. It costs one `ollama pull` and changes
      nothing else in the stack, which makes same-size the REASON to act, not a reason
      to shrug. Weigh new releases on capability against the model he runs TODAY
      (qwen3.8:27b), not merely on whether they fit.

      A MODEL CARD IS A CLAIM, NOT A BENCHMARK. Hugging Face trending surfaces
      community merges and finetunes whose cards are written by the uploader, and
      their numbers are self-reported with no independent eval behind them. Phrases
      like "exceeds the base model in ALL benchmarks", stacked merge names
      (TURBO / Cold-Fusion / Heretic / Uncensored / MAX / NEO), and version numbers
      no upstream lab has published are marketing, and repeating them as findings is
      the failure this rule exists to stop. Treat a first-party release (Qwen, Google,
      Mistral, Meta, Microsoft) or an independent head-to-head as evidence; treat an
      unaffiliated re-upload's own card as a rumour, and say so if you carry it at all.

      THE RESIDENT SEAT IS A TOOL CALLER. The model this reader runs is the one his
      assistant uses to select from ~11 MCP tools, and that reliability was hard-won.
      Weigh tool-calling and structured-output reliability ABOVE benchmark deltas:
      abliteration ("uncensored", "Heretic") and heavy merging degrade exactly that,
      and nobody who publishes these merges measures it. A drop-in successor that
      cannot be trusted to emit a tool call is not an upgrade at any benchmark score.

      A runtime release (ollama, llama.cpp) that ADDS SUPPORT for a model is not a
      minor version bump — it is the prerequisite that makes that model pullable at
      all. When a story depends on one, name the minimum version.

      Capacity is not capability — check BOTH:
        - "Fits in 24GB" does not mean it runs well. Ampere sm_86 has NO FP4 tensor
          cores, so NVFP4 / MXFP4 / W4A4 checkpoints get none of their advertised
          speedup here — those need Blackwell (sm_120+, RTX 50-series). A card-size
          match is not a hardware match.
        - If it isn't GGUF (or doesn't have a GGUF build), ollama cannot load it.
          safetensors/AWQ/GPTQ/NVFP4 artifacts served "via vLLM" are NOT usable.

      INCLUDE only: open-weights models with a GGUF he could pull and run tonight;
      quantizations that newly make a good model fit ~24GB at usable quality;
      head-to-head benchmarks between open models; and ollama/llama.cpp releases that
      change what THIS card can run.

      A model card for a NEW model IS news — do not reject it as "reference". That is
      how an open model announces itself, and Hugging Face is a deliberate source here.
      Reject a model card only when the model is not actually new (an established
      checkpoint merely resurfacing in a trending list), or when it is a bare re-upload
      of someone else's weights adding nothing. Docs, tutorials, and index pages that
      list many releases remain reference, not news.

      EXCLUDE, no matter how big the news: closed/API-only models (OpenAI, Anthropic,
      Gemini, Grok) — he cannot download them; anything whose speed claim depends on
      hardware he lacks (see above); formats ollama can't load; documentation,
      tutorials and "release notes" index pages; models far too large for 24GB with no
      quantization that fits; AI business, funding and policy news; and
      SEO/aggregator/content-farm sources — prefer primary announcements and
      reputable outlets.

      When an item's usefulness depends on hardware or format, SAY SO in the writeup
      rather than repeating a vendor's headline number.
    # Hard facts about this rig, enforced in code — the model kept selecting NVFP4
    # despite the brief forbidding it, then wrote up its Blackwell-only "2.5x faster"
    # as if it applied to an Ampere card. Not a judgment call; not the model's job.
    # A 3090 (sm_86) has no FP4 tensor cores, and ollama loads GGUF only.
    exclude:
      - '\bnvfp4\b'          # Blackwell-only (sm_120+); no speedup on Ampere
      - '\bmxfp4\b'          # same
      - '\bw4a4\b'           # 4-bit activations need FP4 tensor cores
      - '\bfp4\b'
      - '-FP8$'              # FP8 checkpoints: Hopper/Blackwell path, not ollama GGUF

    # Named, not searched. DDG for this topic returns SEO content farms; these are
    # where the news actually breaks. Add a feed here rather than a query.
    sources:
      - type: rss
        label: r/LocalLLaMA
        url: https://www.reddit.com/r/LocalLLaMA/top.rss?t=week
        limit: 25
        body_is_story: true   # the thread text IS the story; reddit resists scraping
      - type: rss
        label: Simon Willison
        url: https://simonwillison.net/atom/everything/
        limit: 15
      # First-party. The vendor that matters most here was reaching this column only
      # as second-hand Reddit chatter; this is the release itself.
      - type: rss
        label: Qwen (official blog)
        url: https://qwenlm.github.io/blog/index.xml
        limit: 10
      - type: rss
        label: Interconnects
        url: https://www.interconnects.ai/feed
        limit: 10
      - type: github_releases
        repo: ollama/ollama
        limit: 3
      - type: github_releases
        repo: ggml-org/llama.cpp
        limit: 3
      - type: github_releases
        repo: vllm-project/vllm
        limit: 2
      - type: hf_trending
        limit: 30

  # ── Restored 2026-09-15. These two were cut at eb09d2c because the ORIGINAL
  # versions ran on DDG queries and returned content farms — the 2026-06-30 issue
  # led World & Politics with "Geopolitical Week Ahead: June 29 – July 5". The cut
  # was right; the queries were the problem, not the subjects. Same fix as the Local
  # AI column got: name the sources, let the model choose among them.
  - name: AI & the World
    per_column: 4
    recommend: false          # "is it time to act?" is a rig question; this isn't one
    # The global 18000 was written for model cards and release notes. This column's
    # sources are essays — Zvi's 2026-09-15 post on the Amodei piece was 70,383 chars,
    # and truncating at 18k fed the writer the opening block quotes, which produced
    # "the essay names its call after a letter signed by lab employees in July" as the
    # summary of the week's biggest AI story. The checker reads the same window.
    max_article_chars: 45000
    brief: |
      This section answers: "what is happening IN AI that I would be embarrassed not
      to know?" It is the discourse column, not the download column.

      THE GAP IT EXISTS TO CLOSE: the Local AI column excludes closed/API-only labs
      by design, so for months the biggest stories in the field — lab policy fights,
      safety arguments, the economics, who said what about where this is going —
      reached this reader not at all. Anything a well-read person would expect him to
      have an opinion on belongs here.

      INCLUDE: statements and essays by the people who set the field's direction
      (lab heads, chief scientists, senior researchers); AI policy, regulation and
      national strategy; safety and alignment arguments that practitioners are
      actually having; the industry's economics — capex, data centres, compute
      supply, valuations, the bubble question; labour and social impact where there
      is real evidence; notable disagreements between serious people.

      CLOSED LABS ARE IN SCOPE HERE. OpenAI, Anthropic, Google DeepMind, Meta,
      xAI, Mistral — the other column bans them because he cannot run them; this
      column covers them because he lives in a world they are shaping.

      EXCLUDE: model releases, weights, quantizations, GGUF, benchmarks, runtime
      versions, VRAM and hardware — that is the Local AI column's beat and running
      it twice wastes the issue. Also exclude: funding-round and stock-price
      churn with no argument attached, product launches, and "10 ways AI will
      change X" listicles.

      A DISAGREEMENT IS THE STORY. When serious people are split, say who holds
      which position and why — do not flatten it into "experts are debating".
    sources:
      - type: rss
        label: Import AI (Jack Clark)
        url: https://jack-clark.net/feed/
        limit: 10
      - type: rss
        label: Transformer
        url: https://www.transformernews.ai/feed
        limit: 15
      - type: rss
        label: Zvi Mowshowitz
        url: https://thezvi.substack.com/feed
        limit: 10
      - type: rss
        label: Ars Technica
        url: https://feeds.arstechnica.com/arstechnica/technology-lab
        limit: 20
      # First-party, so the column can cite a lab's own words instead of commentary
      # about them. The verifier is right to strip claims about what an essay argues
      # when the only source is someone else's post ABOUT that essay — the cure is a
      # primary document in the candidate pool, not a laxer checker.
      # NOTE: Anthropic and darioamodei.com publish NO feed — every rss/atom/index
      # path 404s (checked 2026-09-15). There is no first-party option for them.
      - type: rss
        label: OpenAI (first-party)
        url: https://openai.com/news/rss.xml
        limit: 15

  - name: US Politics
    per_column: 4
    recommend: false
    brief: |
      This section answers: "what actually happened in American politics this week?"

      INCLUDE: things that HAPPENED — legislation moving or dying, executive actions,
      court rulings, agency decisions, elections and their results, investigations
      reaching a milestone, confirmed personnel changes. Name who did what, under
      what authority, and what changes as a result.

      EXCLUDE, and this is most of the feed volume: polling and horse-race coverage;
      "X slams Y" and statements-about-statements; anonymous-source palace intrigue;
      opinion and columns, however good; anything whose entire content is an
      unnamed official's reaction. If the story would read the same with the names
      swapped, it is not news.

      NEUTRALITY IS A REQUIREMENT, NOT A STYLE. Report what happened in the words a
      wire service would use. Do not adopt a source's framing, characterise motives,
      or tell the reader what to think — including when the sources themselves do.
      Where outlets genuinely disagree on the facts, say that plainly and attribute.
      Where they disagree only on interpretation, report the fact and drop the
      interpretation.
    sources:
      # Chosen on what can be READ, not only on what is worth reading. Measured
      # 2026-09-15 as (rss body chars -> scraped article chars): PBS 187->0,
      # The Hill 451->0, Politico 183->0, NPR 254->253. All four block or defeat
      # trafilatura, so a story selected from them is written from a ~200-char
      # teaser — which is exactly why this column's first v2 run produced bullets
      # like "The repeal affects coal and gas-fired power plants". Dropped for that
      # reason alone; their reporting is fine, the pipeline just cannot see it.
      # AP and Reuters publish no working public RSS at all (AP 403s, Reuters 404s).
      - type: rss
        label: Guardian US politics
        url: https://www.theguardian.com/us-news/us-politics/rss
        limit: 20
      - type: rss
        label: NBC News politics
        url: https://feeds.nbcnews.com/nbcnews/public/politics
        limit: 20
      - type: rss
        label: CBS News politics
        url: https://www.cbsnews.com/latest/rss/politics
        limit: 20
      - type: rss
        label: BBC US & Canada
        url: https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml
        limit: 15
      # Counterweight. Note this is constrained by scrapability rather than by
      # editorial preference: National Review (161->0) and the Washington Examiner
      # (413->606) were both tested and cannot be read, so Reason is the only
      # right-of-center source here that yields an article. Worth revisiting.
      - type: rss
        label: Reason
        url: https://reason.com/feed/
        limit: 15
